<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>대전 트램 로컬 큐레이션</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main>
    <section id="station-list-view">
      <div class="app-hero">
        <div class="app-hero-inner">
          <div class="hero-topbar">
            <span class="brand-word-large">DWT</span>
            <div class="hero-icons">
              <button class="icon-button" id="notify-button" aria-label="알림" type="button">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>
              </button>
              <button class="icon-button" id="menu-button" aria-label="메뉴" type="button">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
              </button>
            </div>
          </div>
          <div class="stat-block">
            <div class="stat-number">대전으로 떠나는 여행</div>
          </div>

          <div class="carousel" id="hero-carousel">
            <div class="carousel-track" id="carousel-track"></div>
            <button class="carousel-arrow prev" id="carousel-prev" type="button" aria-label="이전">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <button class="carousel-arrow next" id="carousel-next" type="button" aria-label="다음">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
            </button>
            <div class="carousel-controls">
              <button id="carousel-playpause" type="button" aria-label="자동재생 토글">
                <svg id="carousel-play-icon" width="12" height="12" viewBox="0 0 24 24" fill="currentColor" class="hidden"><path d="M8 5v14l11-7z"/></svg>
                <svg id="carousel-pause-icon" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
              </button>
              <span id="carousel-counter">1/4</span>
            </div>
          </div>

          <div class="hero-actions">
            <button id="reserve-button" class="hero-action-button" type="button">예약</button>
            <button id="plan-button" class="hero-action-button outline" type="button">계획 세우기</button>
          </div>
        </div>
      </div>

      <h2 class="hotspot-heading">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c4-3 7-6.5 7-10.5A7 7 0 0 0 5 11.5C5 15.5 8 19 12 22Z"/><circle cx="12" cy="11" r="2.5"/></svg>
        현재 핫플스팟
      </h2>

      <div id="map-overview">
        <div id="district-legend"></div>
        <div id="leaflet-map" class="hidden"></div>
        <svg id="route-svg" viewBox="0 0 320 320"></svg>
      </div>

      <div id="map-detail" class="hidden">
        <button id="map-back-button">← 전체 노선</button>
        <div id="detail-heading"></div>
        <ul id="detail-station-list" class="district-station-list"></ul>
      </div>

      <div id="recommendation-section" class="hidden">
        <h2 id="station-title"></h2>

        <div class="filter-bar">
          <button data-category="">전체</button>
          <button data-category="FOOD">맛집</button>
          <button data-category="CAFE">카페</button>
          <button data-category="ATTRACTION">관광지</button>
        </div>

        <ul id="poi-list"></ul>
      </div>
    </section>

    <section id="reserve-view" class="hidden">
      <button class="back-link" id="reserve-back-button">← 홈으로</button>
      <h2>제휴 매장 예약/문의</h2>
      <div id="reserve-content"></div>
    </section>

    <section id="course-view" class="hidden">
      <button class="back-link" id="course-back-button">← 홈으로</button>
      <h2>나만의 코스</h2>
      <div id="course-content"></div>
    </section>

    <section id="content-view" class="hidden">
      <h2>콘텐츠</h2>
      <div id="content-list"></div>
    </section>

    <section id="poi-detail-view" class="hidden">
      <button id="detail-back-button">← 목록으로</button>
      <div id="poi-detail"></div>
      <div id="poi-course-action"></div>

      <h3>리뷰</h3>
      <ul id="review-list"></ul>
      <form id="review-form">
        <select id="review-rating">
          <option value="5">★★★★★</option>
          <option value="4">★★★★</option>
          <option value="3">★★★</option>
          <option value="2">★★</option>
          <option value="1">★</option>
        </select>
        <input id="review-content" type="text" placeholder="한줄 후기" />
        <button type="submit">등록</button>
      </form>
    </section>

    <section id="coupon-view" class="hidden">
      <h2>내 쿠폰·스탬프</h2>
      <div id="coupon-content"></div>
    </section>

    <section id="profile-view" class="hidden">
      <h2>마이페이지</h2>
      <div id="profile-content"></div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-item" data-tab="content">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
      <span>콘텐츠</span>
    </button>
    <button class="nav-item" data-tab="tram">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="12" rx="3"/><path d="M4 11h16M9 17l-2 3M15 17l2 3"/><circle cx="8.5" cy="14" r="0.6" fill="currentColor"/><circle cx="15.5" cy="14" r="0.6" fill="currentColor"/></svg>
      <span>트램</span>
    </button>
    <button class="nav-item active" data-tab="home">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      <span>홈</span>
    </button>
    <button class="nav-item" data-tab="coupon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 13l2.5 2.5L16 10"/></svg>
      <span>쿠폰</span>
    </button>
    <button class="nav-item" data-tab="profile">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      <span>내정보</span>
    </button>
  </nav>

  <!-- Leaflet.js + OpenFreeMap(개인 개발자가 운영하는 무료 지도 프로젝트) "Liberty" 스타일: API 키/결제수단 등록 불필요 -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
